<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>HHM record</title>
  <style>
    html,body{height:100%;margin:0;padding:0;overflow:hidden;background:#3A64D8;}
    .wrap{position:absolute;left:50%;top:50%;width:100vmin;height:100vmin;transform:translate(-50%,-50%);}
    .rec{position:absolute;inset:0;width:100%;height:100%;animation:spin 5s linear infinite;}
    .sheen{position:absolute;inset:0;border-radius:50%;pointer-events:none;
      background:conic-gradient(from 300deg,rgba(255,255,255,0) 0deg,rgba(255,255,255,.12) 18deg,rgba(255,255,255,0) 40deg,
        rgba(255,255,255,0) 180deg,rgba(255,255,255,.08) 198deg,rgba(255,255,255,0) 220deg);
      -webkit-mask:radial-gradient(circle,transparent 0 23%,#000 24% 100%);mask:radial-gradient(circle,transparent 0 23%,#000 24% 100%);}
    @keyframes spin{to{transform:rotate(360deg);}}
    /* sh=1: record lifted off the page with a soft shadow underneath; sh=2 adds a slow float (sneak-peek carousel) */
    .shadow{display:none;position:absolute;left:50%;border-radius:50%;pointer-events:none;
      background:radial-gradient(closest-side,rgba(11,13,72,.55),rgba(11,13,72,.28) 55%,rgba(11,13,72,0));}
    /* sizes come from the frame's own viewport units, so they stay right however Tableau creates, hides or resizes the frame */
    body.sh{--s:min(100vw,calc(100vh / 1.22));--t:calc((100vh - var(--s) * 1.22) / 2);}
    body.sh .wrap{width:var(--s);height:var(--s);top:var(--t);transform:translate(-50%,0);}
    body.sh .shadow{display:block;width:calc(var(--s) * .72);height:calc(var(--s) * .13);top:calc(var(--t) + var(--s) * 1.06);transform:translateX(-50%);}
    body.float .wrap{animation:bob 3.6s ease-in-out infinite;}
    body.float .shadow{animation:breathe 3.6s ease-in-out infinite;}
    @keyframes bob{0%,100%{transform:translate(-50%,0);}50%{transform:translate(-50%,calc(var(--s) * -.035));}}
    @keyframes breathe{0%,100%{transform:translateX(-50%) scale(1);opacity:1;}50%{transform:translateX(-50%) scale(.86);opacity:.75;}}
    @media (prefers-reduced-motion:reduce){.rec{animation-duration:24s;} body.float .wrap,body.float .shadow{animation:none;}}
  </style>
</head>
<body>
  <div class="shadow" id="sh"></div>
  <div class="wrap" id="wrap"><img class="rec" id="rec" alt="" /><div class="sheen"></div></div>
  <script>
    var p=new URLSearchParams(location.search);
    var c=(p.get('c')||'CV').replace(/[^A-Z]/g,'').slice(0,2);
    var v=p.get('v')==='next'?'upnext':'title';
    var bg=(p.get('bg')||'3A64D8').replace(/[^0-9A-Fa-f]/g,'').slice(0,6);
    var PEEK='2';                                   /* sneak-peek carousel look: '0' none, '1' shadow, '2' shadow + float */
    var sh=p.get('sh')||(p.get('peek')==='1'?PEEK:null);
    document.body.style.background='#'+bg;
    document.getElementById('rec').src='record_'+v+'_'+c+'.png?v=2';
    if(sh==='1'||sh==='2'){ document.body.classList.add('sh'); if(sh==='2') document.body.classList.add('float'); }
  </script>
</body>
</html>
